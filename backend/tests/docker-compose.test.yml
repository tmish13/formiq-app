# Integration-test Docker Compose
# Usage:
#   docker compose -f tests/docker-compose.test.yml up -d
#   pytest -q -m integration --override-ini="addopts=-q --asyncio-mode=auto --cov=app --cov-report=term-missing --cov-branch --no-cov-on-fail"
#   docker compose -f tests/docker-compose.test.yml down -v

version: "3.9"

services:
  db-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: formiq_test
      POSTGRES_PASSWORD: formiq_test
      POSTGRES_DB: formiq_test_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formiq_test -d formiq_test_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

# Set these env vars before running integration tests:
#   TEST_DATABASE_URL=postgresql+asyncpg://formiq_test:formiq_test@localhost:5434/formiq_test_db
#   TEST_REDIS_URL=redis://localhost:6380/0
