version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
      - ../../.env:/app/.env:ro
      - uploads:/app/uploads
      - formiq_shared:/var/formiq_celery_shared
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-formiq}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_SHARED_DATA_PATH=/var/formiq_celery_shared
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      # min_length=32 enforced by Settings.SECRET_KEY (app/core/config.py:177).
      # The previous default was 27 chars and made `docker compose up` fail to boot.
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-key-32chars-minimum}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - UPLOAD_DIR=uploads/videos
      - UPLOAD_URL=http://localhost:8000/uploads/videos
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    # -P prefork, not gevent. Under gevent every task shares one thread, so the
    # asyncio.run() wrapper in analysis_tasks raises "cannot be called from a
    # running event loop" and the task dies. Measured: 17 of 20 tasks died and
    # stayed PENDING forever. Prefork gives each task its own process and a
    # fresh event loop; the same 20 then completed with zero errors.
    command: celery -A app.core.celery_app.celery_app worker -l info -P prefork --concurrency=4
    volumes:
      - ..:/app
      - ../../.env:/app/.env:ro
      # Must match the `app` service mount: with USE_S3_STORAGE=false the API
      # writes uploads to /app/uploads and the worker reads them back from the
      # same path. Without this volume the worker sees the (empty) bind-mounted
      # host directory instead and pose extraction fails to locate the video.
      - uploads:/app/uploads
      - formiq_shared:/var/formiq_celery_shared
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-formiq}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_SHARED_DATA_PATH=/var/formiq_celery_shared
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      # min_length=32 enforced by Settings.SECRET_KEY (app/core/config.py:177).
      # The previous default was 27 chars and made `docker compose up` fail to boot.
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-key-32chars-minimum}
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ..
      dockerfile: Dockerfile
    # Without this service the Phase 1 stuck-row reaper is dead configuration:
    # `reap_stuck_form_checks` is registered on a beat schedule that nothing
    # runs, so a form check abandoned by a killed worker stays PROCESSING
    # forever in this environment. The same is now true of the unclosed-run
    # sweep added in Stage A.
    #
    # One replica, always. Two beat processes double-fire every scheduled task,
    # and the reaper re-dispatching the same form check twice is exactly the
    # duplicate-work race the atomic claim exists to prevent.
    command: celery -A app.core.celery_app.celery_app beat -l info
    volumes:
      - ..:/app
      - ../../.env:/app/.env:ro
      - formiq_shared:/var/formiq_celery_shared
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-formiq}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_SHARED_DATA_PATH=/var/formiq_celery_shared
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - SECRET_KEY=${SECRET_KEY:-dev-only-insecure-secret-key-32chars-minimum}
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: formiq_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Must match the app/worker default (`formiq`, lines 19 and 56).
      # These previously disagreed (formiq_db vs formiq), so the API booted
      # against a database that was never created.
      POSTGRES_DB: ${POSTGRES_DB:-formiq}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-formiq}"]

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  uploads:
  formiq_shared: 