[program:formiq]
command=/home/formiq/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
directory=/home/formiq/formiq-app/backend
user=formiq
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/formiq/app.log
stderr_logfile=/var/log/formiq/error.log
environment=ENVIRONMENT="production"

[program:formiq-worker]
command=/home/formiq/venv/bin/python -m app.worker
directory=/home/formiq/formiq-app/backend
user=formiq
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/var/log/formiq/worker.log
stderr_logfile=/var/log/formiq/worker-error.log
environment=ENVIRONMENT="production"

[group:formiq-all]
programs=formiq,formiq-worker
priority=999 