[alembic]
script_location = migrations
# define how an auto-generated migration script will be named
# syntax is: %%(rev)s_%%(slug)s
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Refer to the Alembic documentation for other configuration options.

[post_write_hooks]
# Command to run after a migration script is generated
# hooks = autopep8 -i %%(script_location)s

sqlalchemy.url = postgresql://user:password@host:port/dbname_placeholder 