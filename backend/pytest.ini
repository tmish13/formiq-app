[pytest]
# ============================================================
# FormIQ Test Configuration
# ============================================================
# Two-tier test system:
#
#   Unit/API gate  (CI default):
#     pytest -q -m "not integration"
#
#   Integration gate (requires Docker services):
#     docker compose -f tests/docker-compose.test.yml up -d
#     pytest -q -m integration --override-ini="addopts=-q --asyncio-mode=auto --cov=app --cov-report=term-missing --cov-branch --no-cov-on-fail"
#
# Marker reference:
#   unit        – pure unit test, no I/O
#   api         – HTTP contract test using FastAPI TestClient + dependency overrides
#   integration – needs live DB / Redis / Celery (excluded from CI default)
#   e2e         – full end-to-end smoke (excluded from CI default)
#   slow        – takes > 5 s (excluded from CI default)
# ============================================================

# Exclude integration/e2e/slow by default so plain `pytest` is the CI gate.
addopts = -m "not integration and not e2e and not slow" --asyncio-mode=auto --cov=app --cov-report=term-missing --cov-branch --no-cov-on-fail -q

testpaths = tests
norecursedirs = tests/legacy .git __pycache__ .tox .venv venv
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Force test environment
env =
    ENVIRONMENT=test

# Markers
markers =
    unit: pure unit test – no external I/O
    api: HTTP contract test using FastAPI TestClient + dependency overrides
    integration: requires live DB / Redis / Celery (excluded from CI default)
    e2e: full end-to-end smoke test (excluded from CI default)
    slow: test takes > 5 seconds (excluded from CI default)
    mobile: mobile-specific test
    auth: authentication test
    db: database test
    pipeline: pipeline segment test

# Logging
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeouts
timeout = 300

# Required plugins
required_plugins =
    pytest-asyncio
    pytest-cov
    pytest-timeout
    pytest-mock
