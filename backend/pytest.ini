[pytest]
addopts = --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=85 --cov-branch --no-cov-on-fail --asyncio-mode=auto
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .

# Commenting out the env section to rely on command-line for ENVIRONMENT=test
# and to avoid PytestConfigWarning until pytest-env is potentially added.
# env_override_existing_values = 1
