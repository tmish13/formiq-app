name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v3

    # Frontend setup and test
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Run frontend tests
      working-directory: frontend
      run: npm test -- --coverage --watchAll=false

    - name: Run frontend linting
      working-directory: frontend
      run: npm run lint

    # Backend setup and test
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: backend/requirements.txt

    - name: Install backend dependencies
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run backend tests
      working-directory: backend
      run: |
        pytest --cov=. --cov-report=xml

    - name: Run backend linting
      working-directory: backend
      run: |
        pip install flake8 black isort
        flake8 .
        black . --check
        isort . --check-only

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker images
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        # Build and push backend image
        docker build -t $ECR_REGISTRY/formiq-backend:${{ github.sha }} ./backend
        docker push $ECR_REGISTRY/formiq-backend:${{ github.sha }}

        # Build and push frontend image
        docker build -t $ECR_REGISTRY/formiq-frontend:${{ github.sha }} ./frontend
        docker push $ECR_REGISTRY/formiq-frontend:${{ github.sha }}

    - name: Update ECS services
      run: |
        # Update backend service
        aws ecs update-service --cluster formiq-cluster --service backend-service --force-new-deployment

        # Update frontend service
        aws ecs update-service --cluster formiq-cluster --service frontend-service --force-new-deployment 