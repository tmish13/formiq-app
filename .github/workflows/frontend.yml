# frontend.yml — the one frontend workflow (G-17).
#
# Replaces main.yml and frontend-tests.yml, both of which were auto-failed on every run for a
# deprecated actions/upload-artifact and (frontend-tests.yml) ran `npm test` from the repo root.
# Node 20 per frontend/package.json "engines". Typecheck, then jest; no artifacts.
name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend

jobs:
  typecheck_and_test:
    name: "Typecheck & Jest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Jest
        run: npm test -- --ci --watchAll=false
