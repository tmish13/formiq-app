name: Frontend Tests

on:
  push:
    paths:
      - 'frontend/**'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Detect Duplicate Tests
      run: |
        echo "Checking for duplicate test files..."
        DUPLICATES=$(find ./frontend/src -type f -name '*.test.ts*' | rev | cut -d'/' -f1 | rev | sort | uniq -d)
        if [ ! -z "$DUPLICATES" ]; then
          echo "Error: Found duplicate test files:"
          echo "$DUPLICATES"
          exit 1
        fi
        
    - name: Run tests
      run: npm test
      
    - name: Run test coverage
      run: npm run test:coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: frontend/coverage
        flags: frontend
        fail_ci_if_error: true

    - name: Check coverage threshold
      run: |
        COVERAGE=$(cat frontend/coverage/coverage-summary.json | jq -r '.total.lines.pct')
        if (( $(echo "$COVERAGE < 85" | bc -l) )); then
          echo "Coverage is below 85%: $COVERAGE%"
          exit 1
        fi
        echo "Coverage is above 85%: $COVERAGE%" 