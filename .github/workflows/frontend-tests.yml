name: Frontend Tests

on:
  push:
    paths:
      - 'frontend/**'
      - 'tests/**'
      - 'lighthouse/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'frontend/**'
      - 'tests/**'
      - 'lighthouse/**'
      - 'scripts/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint codebase
      run: |
        echo "Running ESLint on codebase..."
        cd frontend
        npm run lint
        
    - name: Type-check codebase
      run: |
        echo "Running TypeScript type checking..."
        cd frontend
        npm run typecheck
      
    - name: Generate test matrix
      run: |
        echo "Generating test functionality matrix..."
        chmod +x ./scripts/generate-matrix.sh
        ./scripts/generate-matrix.sh
        
    - name: Check test consolidation status
      run: |
        echo "Analyzing test consolidation status..."
        chmod +x ./scripts/check-consolidation.sh
        ./scripts/check-consolidation.sh
        
    - name: Check for consolidated tests
      run: |
        echo "Checking for test consolidation..."
        CONSOLIDATED=$(find ./tests/consolidated -type f -name '*.consolidated.test.ts*' | wc -l)
        echo "Found $CONSOLIDATED consolidated test files"
        if [ "$CONSOLIDATED" -lt 5 ]; then
          echo "Warning: Expected at least 5 consolidated test files, found $CONSOLIDATED"
        fi
        
    - name: Detect Redundant Tests
      run: |
        echo "Checking for redundant test files marked for consolidation..."
        DUPLICATES=$(find ./frontend/src -type f -name '*deprecated*.test.ts*' | wc -l)
        echo "Found $DUPLICATES deprecated test files that should be removed"
        if [ "$DUPLICATES" -gt 0 ]; then
          echo "Warning: Found $DUPLICATES deprecated test files that should be consolidated"
          find ./frontend/src -type f -name '*deprecated*.test.ts*' -print
        fi
        
    - name: Run tests
      run: npm test
      
    - name: Run test coverage
      run: npm run test:coverage

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        directory: frontend/coverage
        flags: frontend
        fail_ci_if_error: true
    
    - name: Update Jest snapshots
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Updating Jest snapshots on main branch..."
        cd frontend
        npm test -- -u
        
        # If snapshots were updated, commit and push them
        if [ -n "$(git status --porcelain)" ]; then
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "chore: update test snapshots [skip ci]"
          git push
        else
          echo "No snapshot changes to commit"
        fi
    
    - name: Lighthouse check
      run: |
        npm install -g @lhci/cli
        lhci autorun --collect.url=http://localhost:3000 --collect.startServerCommand="npm start" --upload.target=temporary-public-storage --budget.path=./lighthouse/budgets.json

    - name: Check coverage threshold
      run: |
        echo "Coverage thresholds now defined in jest.config.js"
        
    - name: Check for security headers
      run: |
        echo "Running security header tests..."
        npx jest tests/security/CSPHeaders.test.ts
    
    - name: Report test stats
      run: |
        echo "=== Test Suite Summary ==="
        echo "Total test files: $(find ./frontend/src -type f -name '*.test.ts*' | wc -l)"
        echo "Consolidated test files: $(find ./tests/consolidated -type f -name '*.consolidated.test.ts*' | wc -l)"
        echo "E2E test files: $(find ./tests/e2e -type f -name '*.test.ts*' | wc -l)"
        echo "Security test files: $(find ./tests/security -type f -name '*.test.ts*' | wc -l)"
        
    - name: Upload test matrix and consolidation report as artifacts
      uses: actions/upload-artifact@v3
      with:
        name: test-reports
        path: |
          ./frontend-test-functionality-matrix.md
          ./test-consolidation-report.md

    - name: Run tests with consolidated files
      run: |
        echo "Running tests with consolidated files..."
        cd frontend
        npm test -- --testPathPattern="^(.*consolidated.test.*)$" --coverage

    - name: Generate test coverage summary
      run: |
        echo "## Test Coverage Summary" > coverage-summary.md
        echo "" >> coverage-summary.md
        echo "| Category | Coverage |" >> coverage-summary.md
        echo "|----------|----------|" >> coverage-summary.md
        
        if [ -f frontend/coverage/coverage-summary.json ]; then
          STATEMENTS=$(jq '.total.statements.pct' frontend/coverage/coverage-summary.json)
          BRANCHES=$(jq '.total.branches.pct' frontend/coverage/coverage-summary.json)
          FUNCTIONS=$(jq '.total.functions.pct' frontend/coverage/coverage-summary.json)
          LINES=$(jq '.total.lines.pct' frontend/coverage/coverage-summary.json)
          
          echo "| Statements | ${STATEMENTS}% |" >> coverage-summary.md
          echo "| Branches | ${BRANCHES}% |" >> coverage-summary.md
          echo "| Functions | ${FUNCTIONS}% |" >> coverage-summary.md
          echo "| Lines | ${LINES}% |" >> coverage-summary.md
        else
          echo "Coverage report not found" >> coverage-summary.md
        fi

    - name: Upload coverage as artifact
      uses: actions/upload-artifact@v2
      with:
        name: coverage-report
        path: frontend/coverage

    - name: Comment with Coverage Results
      uses: marocchino/sticky-pull-request-comment@v2
      if: github.event_name == 'pull_request'
      with:
        path: coverage-summary.md 