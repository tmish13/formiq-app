version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # NOTE: no --queues flag. Tasks are published with .delay() and there is no
    # task_routes config anywhere in app/, so every task goes to Celery's default
    # queue ("celery"). This worker previously subscribed to
    # video_processing,pose_detection,form_analysis — three queues nothing ever
    # publishes to — so it consumed nothing and form checks sat at PENDING
    # forever. Consume the default queue instead, which is where the work is.
    command: >
      celery -A app.core.celery_app:celery_app worker
      --loglevel=info
      --concurrency=2
      --pool=prefork
    volumes:
      - ./backend:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URL=redis://redis:6379/0
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - ENVIRONMENT=development
      - USE_S3_STORAGE=true
      - VIDEO_FRAME_RATE=30
      - MAX_VIDEO_FRAMES=300
      - MAX_VIDEO_SIZE_MB=100
      - MAX_VIDEO_DURATION=60
      - MIN_CONFIDENCE_THRESHOLD=0.7
      - SQLALCHEMY_DATABASE_URI=${DATABASE_URL}
    depends_on:
      - redis

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app:celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - redis
      - celery-worker

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.core.celery_app:celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - redis
      - celery-worker

volumes:
  redis-data: 