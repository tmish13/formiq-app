<svg width="180" height="60" viewBox="0 0 180 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient shape -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D7CFE"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>
  
  <!-- Logo symbol - stylized F with bar chart -->
  <g>
    <!-- F shape -->
    <path d="M25 10C25 10 35 10 40 10C45 10 50 15 50 20C50 25 45 30 40 30C35 30 30 30 30 30" stroke="url(#logoGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 20C30 20 40 20 45 20" stroke="url(#logoGradient)" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 10L30 50" stroke="url(#logoGradient)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Bar chart (representing analytics) -->
    <rect x="40" y="35" width="5" height="15" rx="2" fill="url(#logoGradient)"/>
    <rect x="47" y="30" width="5" height="20" rx="2" fill="url(#logoGradient)"/>
    <rect x="54" y="25" width="5" height="25" rx="2" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Text "FormIQ" -->
  <text x="70" y="35" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="#2D3748">
    Form<tspan fill="#4D7CFE">IQ</tspan>
  </text>
</svg> 