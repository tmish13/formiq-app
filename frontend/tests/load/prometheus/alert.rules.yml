groups:
- name: FormIQ Alerts
  rules:
  # Response Time Alerts
  - alert: HighResponseTime
    expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: "High response time detected"
      description: "95th percentile of response time is above 2 seconds"

  # Error Rate Alerts
  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High error rate detected"
      description: "Error rate is above 1%"

  # AI Model Alerts
  - alert: LowModelConfidence
    expr: rate(model_confidence_below_threshold_total[5m]) > 0
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Low model confidence detected"
      description: "AI model confidence is below threshold"

  - alert: ModelFailureRate
    expr: rate(model_inference_failures_total[5m]) / rate(model_inference_total[5m]) > 0.05
    for: 2m
    labels:
      severity: critical
    annotations:
      summary: "High model failure rate"
      description: "AI model failure rate is above 5%"

  # Resource Usage Alerts
  - alert: HighCPUUsage
    expr: rate(process_cpu_seconds_total[5m]) > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High CPU usage"
      description: "CPU usage is above 80%"

  - alert: HighMemoryUsage
    expr: process_resident_memory_bytes / process_total_memory_bytes > 0.85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "High memory usage"
      description: "Memory usage is above 85%"

  # Concurrent Request Alerts
  - alert: HighConcurrentRequests
    expr: rate(concurrent_requests_total[1m]) > 100
    for: 1m
    labels:
      severity: warning
    annotations:
      summary: "High number of concurrent requests"
      description: "More than 100 concurrent requests per minute"

  # Circuit Breaker Alerts
  - alert: CircuitBreakerTripped
    expr: circuit_breaker_failures_total > 3
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Circuit breaker tripped"
      description: "Multiple failures triggered circuit breaker" 