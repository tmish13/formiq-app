name: Frontend Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Jest tests
        run: npm test -- --coverage
        env:
          CI: true
      
      - name: Verify coverage thresholds
        run: |
          # Check if coverage report exists
          if [ ! -f ./coverage/coverage-summary.json ]; then
            echo "Error: Coverage report not found!"
            exit 1
          fi
          
          # Extract coverage percentages
          statements=$(jq '.total.statements.pct' ./coverage/coverage-summary.json)
          branches=$(jq '.total.branches.pct' ./coverage/coverage-summary.json)
          functions=$(jq '.total.functions.pct' ./coverage/coverage-summary.json)
          lines=$(jq '.total.lines.pct' ./coverage/coverage-summary.json)
          
          # Check against thresholds
          threshold_statements=70
          threshold_branches=60
          threshold_functions=70
          threshold_lines=70
          
          echo "Coverage Results:"
          echo "Statements: $statements% (threshold: $threshold_statements%)"
          echo "Branches: $branches% (threshold: $threshold_branches%)"
          echo "Functions: $functions% (threshold: $threshold_functions%)"
          echo "Lines: $lines% (threshold: $threshold_lines%)"
          
          if (( $(echo "$statements < $threshold_statements" | bc -l) )); then
            echo "Error: Statement coverage below threshold!"
            exit 1
          fi
          
          if (( $(echo "$branches < $threshold_branches" | bc -l) )); then
            echo "Error: Branch coverage below threshold!"
            exit 1
          fi
          
          if (( $(echo "$functions < $threshold_functions" | bc -l) )); then
            echo "Error: Function coverage below threshold!"
            exit 1
          fi
          
          if (( $(echo "$lines < $threshold_lines" | bc -l) )); then
            echo "Error: Line coverage below threshold!"
            exit 1
          fi
          
          echo "All coverage thresholds met!"
      
      - name: Upload test coverage
        uses: actions/upload-artifact@v3
        with:
          name: test-coverage
          path: frontend/coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          directory: ./frontend/coverage
          flags: frontend
          fail_ci_if_error: true

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build app
        run: npm run build
      
      - name: Serve app
        run: npx serve -s build &
      
      - name: Run BackstopJS tests
        run: npm run test:backstop
      
      - name: Upload screenshots
        uses: actions/upload-artifact@v3
        with:
          name: backstop-report
          path: frontend/backstop_data

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Run TypeScript type check
        run: npm run typecheck

  build:
    name: Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build production bundle
        run: npm run build
      
      - name: Analyze bundle size
        run: npx source-map-explorer 'build/static/js/*.js' --html build-analysis.html
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-build
          path: |
            frontend/build
            frontend/build-analysis.html 