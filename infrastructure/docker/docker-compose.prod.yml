version: '3.8'

services:
  backend:
    build:
      context: ./backend
      target: production
    image: formiq/backend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app
    depends_on:
      - db
    networks:
      - formiq-network

  frontend:
    build:
      context: ./frontend
      target: production
    image: formiq/frontend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - formiq-network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - formiq-network

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/docker/nginx/ssl:/etc/nginx/ssl:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - formiq-network

volumes:
  postgres_data:
  frontend_build:

networks:
  formiq-network:
    name: formiq-network 