groups:
  - name: formiq
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.02
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High error rate detected
          description: Error rate is above 2% for the last 2 minutes

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High latency detected
          description: 95th percentile latency is above 500ms

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage
          description: CPU usage is above 85%

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage
          description: Memory usage is above 90%

      - alert: HighDiskUsage
        expr: (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}) / node_filesystem_size_bytes{mountpoint="/"} * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High disk usage
          description: Disk usage is above 85%

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Service is down
          description: Service {{ $labels.job }} is down

      - alert: HighModelInferenceLatency
        expr: histogram_quantile(0.95, rate(model_inference_duration_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: High model inference latency
          description: 95th percentile model inference time is above 1 second

      - alert: LowModelConfidence
        expr: histogram_quantile(0.5, rate(model_confidence_scores_bucket[5m])) < 0.6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Low model confidence scores
          description: Median model confidence score is below 0.6

      - alert: HighModelErrorRate
        expr: rate(model_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High model error rate
          description: Model error rate is above 10%

      - alert: HighModelFallbackRate
        expr: rate(model_fallbacks_total[5m]) / rate(http_requests_total{endpoint=~"/api/v1/form-checks/analyze"}[5m]) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High model fallback rate
          description: Model fallback rate is above 20%

      - alert: DatabaseConnectionIssues
        expr: rate(db_connection_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Database connection issues detected
          description: Database connection errors have been detected 